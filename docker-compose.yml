version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - housing_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/housing.db
      - SCRAPE_INTERVAL_HOURS=6
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  housing_data:
